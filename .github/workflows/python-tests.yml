name: Python tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ---------------------------------------------------------------------
  # Always-on tests: engine unit tests that do not require a real
  # WinRing0.sys binary. These exercise the symbolic-execution skeleton,
  # PE-parser failure modes, and the known-IOCTL fallback path.
  # ---------------------------------------------------------------------
  unit-tests:
    name: Unit tests (no binary)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Run unit tests (excluding binary-derived markers)
        run: python -m pytest tests/ -v -m "not requires_binary"

  # ---------------------------------------------------------------------
  # Binary-derived tests: only run when WinRing0.sys is present at the
  # repository root and matches the expected SHA-256. Absence is a
  # CI **skip** with a loud notice — never a silent pass. Hash mismatch
  # is a **failure**.
  #
  # WinRing0.sys is NOT committed (it is a blocklisted BYOVD driver).
  # To exercise this job in a fork, place a hash-verified copy in the
  # runner before this job runs (e.g. via a self-hosted runner with the
  # binary pre-staged, or a secrets-protected fetch step).
  # ---------------------------------------------------------------------
  binary-tests:
    name: Binary-derived tests (requires WinRing0.sys)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt

      - name: Check for case-study binary
        id: binary_check
        run: |
          if [ -f WinRing0.sys ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Binary-derived tests skipped::WinRing0.sys is not present in the workspace; binary-derived tests will not run. See README §'Obtaining the case-study sample' to enable them locally."
          fi

      - name: Verify SHA-256 of WinRing0.sys
        if: steps.binary_check.outputs.present == 'true'
        run: python verify_binary.py WinRing0.sys

      - name: Run binary-derived tests
        if: steps.binary_check.outputs.present == 'true'
        run: python -m pytest tests/ -v -m "requires_binary"
